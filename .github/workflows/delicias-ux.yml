name: Delicias UX visual QA
on:
  push:
    branches: [demo/delicias-viajantes-20261101]
    paths:
      - public/demos/delicias-viajantes/index.html
      - scripts/qa-delicias-visual.mjs
      - .github/workflows/delicias-ux.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: node scripts/qa-delicias-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delicias-visual-qa
          path: artifacts/delicias-ux/
          retention-days: 7
