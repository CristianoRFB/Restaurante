name: Food Browser E2E
on:
  push:
    branches: ['codex/food-core-leads-demo-foundation']
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test Food A/B browser with local Firebase Emulators
        run: npx firebase emulators:exec --project demo-baru-gastronomia --only firestore,auth 'npm run test:e2e:food'
        env:
          CI: 'true'
      - name: Publish synthetic-only browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: food-browser-e2e-report
          path: |
            playwright-food-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
